<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InkHub – Genuine Ink & Printers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --o: #ee4d2d; --od: #d73f21; --bg: #f5f5f5; --ink: #1f1f1f; --mut: #6b6b6b;
  --line: #e9e9e9; --ok: #1a9b6c; --bad: #d93a3a; --y: #f5b400; --navy: #1f2a44; --teal: #0f766e;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 120px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 'Inter', 'Noto Sans Thai', system-ui, sans-serif;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.w { max-width: 1200px; margin: auto; padding: 0 16px; }
.g { color: var(--o); }
.mut { color: var(--mut); font-size: 13px; }
.mono { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
.i { flex: none; vertical-align: middle; }
.i.thin { stroke-width: 1.1; }
.i.fill { fill: currentColor; stroke: none; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
 
/* Header */
header { position: sticky; top: 0; z-index: 30; background: var(--o); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.top { background: rgba(0,0,0,.1); font-size: 12.5px; }
.top .row { height: 34px; }
.top .l, .top .r { display: flex; align-items: center; gap: 18px; }
.top span, .top a { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.top a:hover { opacity: .8; }
.lang { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 99px; overflow: hidden; }
.lang a { padding: 1px 11px; font-size: 12px; }
.lang a.on { background: #fff; color: var(--o); font-weight: 600; }
.nav { display: grid; grid-template-columns: 190px 1fr 70px; gap: 22px; align-items: center; padding: 10px 16px 6px; }
.logo { display: flex; align-items: center; gap: 10px; font: 700 25px 'Inter'; letter-spacing: -.02em; }
.sb { display: flex; background: #fff; border-radius: 4px; padding: 3px; }
.sb input { border: 0; outline: 0; background: none; padding: 9px 12px; color: var(--ink); flex: 1; min-width: 0; }
.sb button { background: var(--o); border: 0; color: #fff; padding: 0 22px; border-radius: 3px; cursor: pointer; display: grid; place-items: center; }
.sb button:hover { background: var(--od); }
.kw { display: flex; gap: 16px; font-size: 12px; margin-top: 7px; overflow: hidden; white-space: nowrap; }
.kw a { opacity: .92; cursor: pointer; }
.kw a:hover { text-decoration: underline; }
.crt { position: relative; justify-self: center; display: grid; place-items: center; }
.badge { position: absolute; top: -8px; right: -10px; background: #fff; color: var(--o); border-radius: 99px; font: 600 11px 'Inter'; min-width: 20px; text-align: center; padding: 1px 5px; border: 1px solid var(--o); }
.badge.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.5); } }
 
/* Controls & Buttons */
.btn { background: var(--o); color: #fff; border: 1px solid var(--o); border-radius: 4px; padding: 10px 20px; font-weight: 500; cursor: pointer; transition: .15s; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn:hover { background: var(--od); border-color: var(--od); }
.btn.o { background: #fff; color: var(--o); }
.btn.o:hover { background: #fff4f0; }
.btn.s { padding: 5px 12px; font-size: 13px; }
.btn.sq { width: 34px; height: 34px; padding: 0; }
.btn.d { background: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.blk { width: 100%; }
input, select, textarea { background: #fff; border: 1px solid #d9d9d9; border-radius: 4px; padding: 9px 12px; width: 100%; outline: 0; transition: .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--o); box-shadow: 0 0 0 3px rgba(238,77,45,.12); }
select { width: auto; }
label { font-size: 13px; color: var(--mut); display: grid; gap: 5px; }
.f { display: grid; gap: 12px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.box { background: #fff; border-radius: 6px; padding: 22px; margin-bottom: 14px; border: 1px solid var(--line); }
.two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 3px; background: #fff0ec; color: var(--o); white-space: nowrap; font-weight: 500; }
.tag.g { background: #e5f5ef; color: var(--ok); }
.tag.r { background: #fdeaea; color: var(--bad); }
.tag.y { background: #fff6d9; color: #9a6f00; }
 
/* Hero & Banners */
.hero { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 20px; }
.sld { position: relative; height: 300px; border-radius: 6px; overflow: hidden; }
.sl { position: absolute; inset: 0; opacity: 0; transition: opacity .7s; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; color: #fff; pointer-events: none; }
.sl.on { opacity: 1; pointer-events: auto; }
.sl h3 { font: 700 clamp(26px,3.6vw,42px)/1.12 'Inter','Noto Sans Thai'; letter-spacing: -.02em; margin: 0 0 10px; }
.sl p { margin: 0 0 22px; font-size: 15px; opacity: .9; max-width: 380px; }
.sl .cta { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--ink); font-weight: 600; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
.dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; transition: .2s; }
.dots i.on { background: #fff; width: 20px; border-radius: 4px; }
.sd { display: grid; grid-template-rows: 1fr 1fr; gap: 8px; }
.sp1 { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; cursor: pointer; transition: .2s; overflow: hidden; }
.sp1:hover { border-color: var(--o); }
.sp1 .im { width: 104px; height: 104px; border-radius: 6px; background: #f6f6f6; display: grid; place-items: center; overflow: hidden; flex: none; }
.sp1 .im img { width: 100%; height: 100%; object-fit: cover; }
.sp1 .lb { font-size: 11px; color: var(--o); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.sp1 b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; line-height: 1.35; margin: 2px 0 4px; font-size: 14px; }
.hp { width: 240px; height: 240px; background: #fff; border-radius: 12px; display: grid; place-items: center; overflow: hidden; flex: none; box-shadow: 0 14px 34px rgba(0,0,0,.28); }
.hp img { width: 100%; height: 100%; object-fit: cover; }
 
/* Perks & Sections */
.pk { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; background: #fff; border-radius: 6px; margin-top: 14px; padding: 18px 8px; border: 1px solid var(--line); }
.it { text-align: center; cursor: pointer; font-size: 13px; font-weight: 500; }
.it .ib { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; margin: 0 auto 8px; background: #fff; border: 1px solid var(--line); transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.it:hover .ib { transform: translateY(-3px); border-color: #f0b8aa; box-shadow: 0 6px 14px rgba(0,0,0,.09); }
.sec { background: #fff; border-radius: 6px; margin-top: 14px; border: 1px solid var(--line); overflow: hidden; }
.sh { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
.sh h2 { margin: 0; font: 600 15px 'Inter','Noto Sans Thai'; text-transform: uppercase; letter-spacing: .03em; color: var(--mut); display: flex; align-items: center; gap: 8px; }
.sh h2.o { color: var(--o); }
.sh a { color: var(--o); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
 
/* Grid & Cards */
.vs { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; padding: 16px; }
.vc { display: flex; border: 1px solid #f4c6bb; border-radius: 6px; background: #fff8f5; overflow: hidden; }
.vc .vl { background: var(--o); color: #fff; width: 104px; display: grid; place-items: center; text-align: center; font: 700 22px/1.1 'Inter','Noto Sans Thai'; padding: 10px; position: relative; }
.vc .vr { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; border-left: 2px dashed #f4c6bb; }
.cats { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); }
.cat { padding: 18px 10px; text-align: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; transition: .2s; margin: 0 -1px -1px 0; }
.cat:hover, .cat.on { background: #fff8f5; }
.cat .ci { width: 84px; height: 84px; border-radius: 8px; background: #f6f6f6; display: grid; place-items: center; margin: 0 auto 10px; overflow: hidden; transition: .2s; }
.cat:hover .ci, .cat.on .ci { box-shadow: 0 0 0 2px var(--o); }
.tabs { display: flex; background: #fff; border-bottom: 3px solid var(--o); margin-top: 14px; border-radius: 6px 6px 0 0; }
.tabs div { flex: 1; text-align: center; padding: 14px; color: var(--o); font: 600 15px 'Inter','Noto Sans Thai'; text-transform: uppercase; letter-spacing: .03em; }
.tools { display: flex; gap: 10px; align-items: center; background: #ececec; padding: 10px 14px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { border: 1px solid #d0d0d0; background: #fff; border-radius: 99px; padding: 4px 14px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip.on { border-color: var(--o); color: var(--o); background: #fff4f0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(188px,1fr)); gap: 8px; padding-bottom: 40px; }
.grid.fl, .grid.rv { padding: 16px; gap: 10px; }
.card { position: relative; background: #fff; border-radius: 4px; overflow: hidden; transition: .18s; display: flex; flex-direction: column; border: 1px solid var(--line); }
.card:hover { transform: translateY(-2px); border-color: var(--o); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.th { display: grid; place-items: center; aspect-ratio: 1/1; background: #f6f6f6; overflow: hidden; }
.dc { position: absolute; top: 0; right: 0; background: #fff3cf; color: var(--o); font: 600 12px 'Inter'; padding: 3px 7px 3px 8px; border-radius: 0 0 0 6px; }
.hrt { position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; cursor: pointer; color: #8a8a8a; transition: .2s; }
.hrt:hover, .hrt.on { color: var(--bad); }
.card .b { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.card .nm { font-size: 13px; line-height: 1.35; height: 35px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pr { font: 600 17px 'Inter'; color: var(--o); }
.old { text-decoration: line-through; color: #a3a3a3; font-size: 12px; margin-left: 6px; }
.sold { font-size: 11px; color: var(--mut); }
.left { font-size: 11px; color: var(--bad); font-weight: 500; }
.fs { font-size: 11px; border: 1px solid var(--ok); color: var(--ok); padding: 0 5px; border-radius: 2px; width: max-content; }
.stk { height: 16px; border-radius: 99px; background: #fbd9d0; position: relative; overflow: hidden; }
.stk i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg,#ff7a45,var(--o)); border-radius: 99px; }
.stk span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 10.5px 'Inter'; color: #fff; text-transform: uppercase; }
.star { color: #f5a300; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
 
/* Tables, Details & Extras */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 11px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--mut); font-weight: 500; font-size: 12px; background: #fafafa; }
.sc { overflow-x: auto; }
.tl { display: flex; margin: 16px 0 6px; }
.tl div { flex: 1; text-align: center; font-size: 12px; color: var(--mut); position: relative; }
.tl div:before { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid #ccc; margin: 0 auto 6px; position: relative; z-index: 1; }
.tl div:after { content: ""; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px; background: #ddd; }
.tl div:first-child:after { display: none; }
.tl .on { color: var(--ink); }
.tl .on:before { background: var(--o); border-color: var(--o); }
.tl .on:after { background: var(--o); }
.pay { display: grid; gap: 8px; }
.pay label { flex-direction: row; display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 12px; color: var(--ink); cursor: pointer; }
.pay label:has(input:checked) { border-color: var(--o); background: #fff8f5; }
.pay input { width: auto; }
.nb { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--o); color: #fff; font: 600 12px 'Inter'; margin-right: 8px; }
.qr { width: 150px; height: 150px; margin: 10px auto; background: repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/18px 18px; border: 10px solid #fff; outline: 1px solid var(--line); }
.crumb { padding: 16px 0; color: var(--mut); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumb a { color: var(--o); }
.pband { background: #fafafa; padding: 14px 18px; margin: 12px 0; }
.pband .pr { font-size: 30px; }
.qb { display: inline-flex; }
.qb button { width: 34px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; display: grid; place-items: center; }
.qb input { width: 56px; text-align: center; border-radius: 0; border-left: 0; border-right: 0; }
.pf { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.pf div { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--mut); }
.pf .i { color: var(--o); }
.fsb { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; margin-bottom: 14px; }
.fsb .bar { height: 8px; border-radius: 99px; background: #eee; margin-top: 10px; overflow: hidden; }
.fsb .bar i { display: block; height: 100%; background: var(--o); border-radius: 99px; transition: width .6s; }
.wal { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
.auth { max-width: 400px; margin: 50px auto; }
.authbg { background: var(--o); min-height: calc(100vh - 150px); padding: 30px 0; }
.adm { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { background: #fff; border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.side a { padding: 10px 14px; border-radius: 4px; color: var(--mut); cursor: pointer; font-weight: 500; display: flex; gap: 10px; align-items: center; }
.side a.on, .side a:hover { background: #fff4f0; color: var(--o); }
.sp { flex: 1; }
.main { padding: 28px; overflow-x: auto; }
.st { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px; margin: 18px 0; }
.st .box { margin: 0; }
.st b { font: 600 28px 'Inter'; display: block; }
.bars { display: flex; align-items: flex-end; gap: 12px; height: 160px; }
.bars div { flex: 1; text-align: center; font-size: 11px; color: var(--mut); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.bars i { display: block; border-radius: 3px 3px 0 0; background: var(--o); min-height: 3px; margin-bottom: 6px; }
 
/* Feedback, Floating & Modals */
#toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom,0px)); left: 50%; transform: translate(-50%,30px); opacity: 0; background: rgba(20,20,20,.9); color: #fff; padding: 11px 22px; border-radius: 6px; z-index: 99; transition: .3s; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%,0); }
.fade { animation: fi .35s both; }
@keyframes fi { from { opacity: 0; transform: translateY(8px); } }
.ld { display: grid; place-items: center; height: 60vh; color: var(--mut); }
footer { background: #fff; border-top: 3px solid var(--o); margin-top: 34px; padding: 34px 0 20px; color: var(--mut); font-size: 13px; }
.fg { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin-bottom: 24px; }
.fg b { display: block; color: var(--ink); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.fg span { display: block; margin-bottom: 6px; }
.fab { position: fixed; right: 18px; bottom: 78px; z-index: 40; background: var(--o); color: #fff; border: 0; border-radius: 99px; padding: 11px 18px 11px 14px; display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(238,77,45,.4); transition: .2s; }
.fab:hover { transform: translateY(-2px); }
.fab svg { animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
#up { position: fixed; right: 18px; bottom: 22px; z-index: 40; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: none; place-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
#up.on { display: grid; }
.adm-on .fab, .adm-on #up, .adm-on #rp { display: none !important; }
#rp { position: fixed; left: 18px; bottom: 24px; z-index: 40; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-width: 300px; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .4s; font-size: 13px; }
#rp.on { transform: none; opacity: 1; }
#rp .rpi { width: 34px; height: 34px; border-radius: 50%; background: #fff4f0; color: var(--o); display: grid; place-items: center; flex: none; }
.md { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 80; display: none; place-items: center; padding: 16px; }
.md.on { display: grid; }
.mb { background: #fff; border-radius: 12px; width: 100%; max-width: 400px; padding: 26px 24px 24px; text-align: center; position: relative; }
.mb h3 { margin: 0 0 4px; font: 700 20px 'Inter','Noto Sans Thai'; }
.mx { position: absolute; top: 12px; right: 12px; border: 0; background: #f3f3f3; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.wh { position: relative; width: 290px; height: 290px; margin: 18px auto; }
.wh svg.w1 { width: 100%; height: 100%; transition: transform 5s cubic-bezier(.12,.7,.08,1); filter: drop-shadow(0 4px 10px rgba(0,0,0,.15)); }
.wh .pt { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 2; }
.wh .hub { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #fff; border: 3px solid var(--o); display: grid; place-items: center; color: var(--o); }
 
@media(max-width: 800px) {
  .hp { width: 110px; height: 110px; }
  .sl > div:first-child { max-width: 62%; }
  .sp1 .im { width: 72px; height: 72px; }
  .hero, .two, .adm, .fg, .vs { grid-template-columns: 1fr; }
  .sd { grid-template-columns: 1fr 1fr; grid-template-rows: none; }
  .pk { grid-template-columns: repeat(3,1fr); row-gap: 16px; }
  .side { flex-direction: row; overflow-x: auto; height: auto; position: static; }
  .nav { grid-template-columns: 1fr 50px; gap: 12px; }
  .nav .logo { grid-column: 1/3; }
  .top .l { display: none; }
  .sld { height: 230px; }
  .sl { padding: 0 22px; }
  .sa, .kw { display: none; }
  .f2, .pf { grid-template-columns: 1fr; }
  .tabs { position: static; }
}
</style>
</head>
<body>
<div id="app"><div class="ld">Loading…</div></div>
<div id="toast"></div>
<div id="rp"></div>
<div class="md" id="md" onclick="if(event.target==this)closeM()"><div class="mb" id="mb"></div></div>
<button id="up" onclick="scrollTo({top:0,behavior:'smooth'})" aria-label="Top"></button>
<script>
const mem = {}, LS = (k, v) => {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem(k));
    localStorage.setItem(k, JSON.stringify(v));
  } catch(e) {
    if (v === undefined) return mem[k];
    mem[k] = v;
  }
};
 
/* ---------- i18n Dictionary ---------- */
const T = {
  en: {
    topShip: 'Free shipping on orders over ฿1,500', hot: 'Hot deal', feat: 'Featured', viewP: 'View product', topGen: '100% genuine products', admin: 'Admin', orders: 'My orders', acct: 'Account', logout: 'Log out', signup: 'Sign up', login: 'Log in',
    searchPh: 'Search by printer model, brand or product, e.g. L3250',
    h1t: 'Genuine ink,<br>up to 50% off', h1p: 'Original cartridges and refills for Epson, Canon, HP and Brother.', shop: 'Shop now',
    h2t: 'Printers for<br>home & office', h2p: 'Ink-tank, all-in-one and laser models with official warranty.', h2c: 'Browse printers',

async function rm(c, id) {

async function doLogin(e) {

/* ---------- Admin Panel & Product Management ---------- */
let pend;
function pickImg(i) {
  const f = i.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      let qq = .74, d; do { d = c.toDataURL('image/jpeg', qq); qq -= .1; } while (d.length > 190000 && qq > .2);
      pend = d; const v = $('#pv'); v.style.display = 'flex'; v.querySelector('img').src = d;
    }; im.src = r.result;
  }; r.readAsDataURL(f);
}
 
const setTab = k => { aTab = k; pend = undefined; editId = null; go(); };
 
function admin() {

  }
  if (aTab == 'ord') {
    c = `<div class="box sc"><table><tr><th>${t('orderNo')}</th><th>${t('recipient')}</th><th>${t('totPay')}</th><th>${t('status')}</th><th>${t('parcel')}</th></tr>${O.map(o => `<tr><td><b>#${o.id}</b><br><span class="mut">${dt(o.at)}</span></td><td>${E(o.addr.name)} ${E(o.addr.phone)}<br><span class="mut">${E(o.addr.line)} ${E(o.addr.prov)}</span><br><span class="mut">${o.items.map(i => E(i.name) + '×' + i.q).join(', ')}</span></td><td>${B(o.total)}<br><span class="mut">${PAYN(o.pay)}</span>${o.slip ? `<br><span class="tag g">${t('paid')}: ${E(o.slip.ref)}</span>` : ''}</td><td>${o.st == 5 ? `<span class="tag r">${STN(5)}</span>` : `<select onchange="setSt('${o.id}',+this.value).then(()=>toast(t('tStatus')))">${[0, 1, 2, 3, 4].map(i => `<option value="${i}" ${o.st == i ? 'selected' : ''}>${STN(i)}</option>`).join('')}</select>`}</td><td><input placeholder="${t('carrier')}" value="${E(o.carrier)}" style="width:130px" onchange="trk('${o.id}','carrier',this.value)"><input placeholder="${t('trkPh')}" value="${E(o.trk)}" style="width:150px;margin-top:6px" onchange="trk('${o.id}','trk',this.value)"></td></tr>`).join('') || `<tr><td colspan=5 class="mut">${t('noOrd')}</td></tr>`}</table></div>`;
  }
  if (aTab == 'prod') {
    const e = editId ? P(editId) : { name: '', cat: '', brand: '', price: '', old: '', stock: '', col: '#6b7280', desc: '' };
    c = `<div class="box"><b>${editId ? t('editP') : t('addP')}</b><form class="f" style="margin-top:12px" onsubmit="saveP(event)"><div class="f2"><label>${t('pName')}<input name="name" required value="${E(e.name)}"></label><label>${t('pBrand')}<input name="brand" required value="${E(e.brand)}"></label></div><div class="f2"><label>${t('pCat')}<input name="cat" list="catl" required autocomplete="off" placeholder="${t('catPh')}" value="${E(e.cat)}"><datalist id="catl">${cats().map(x => `<option value="${E(x)}">`).join('')}</datalist></label><label>${t('pColor')}<input name="col" type="color" value="${E(e.col)}"></label></div><div class="f2"><label>${t('pPrice')}<input name="price" type="number" min="0" required value="${e.price}"></label><label>${t('pOld')}<input name="old" type="number" min="0" value="${e.old || ''}"></label></div><div class="f2"><label>${t('pStockL')}<input name="stock" type="number" min="0" required value="${e.stock}"></label><label>${t('pSold')}<input name="sold0" type="number" min="0" value="${e.sold0 ?? ''}"></label></div><label>${t('pDesc')}<input name="desc" value="${E(e.desc)}"></label><label>${t('photo')}<input type="file" accept="image/*" onchange="pickImg(this)"></label><div id="pv" style="display:${e.img ? 'flex' : 'none'};gap:12px;align-items:center"><img src="${E(e.img || '')}" style="max-height:110px;border-radius:4px"><button type="button" class="btn o s" onclick="pend='';$('#pv').style.display='none'">${t('rmPhoto')}</button></div><div style="display:flex;gap:8px"><button class="btn">${t('savebtn')}</button>${editId ? `<button type="button" class="btn o" onclick="setTab('prod')">${t('cancelB')}</button>` : ''}</div></form></div><div class="box sc"><table>${arr('products').map(p => `<tr><td>${E(p.name)}<br><span class="mut">${E(tc(p.cat))} · ${E(p.brand)}</span></td><td>${B(p.price)}</td><td>${p.stock}</td><td style="white-space:nowrap"><button class="btn o s" onclick="editId='${p.id}';pend=undefined;go();scrollTo(0,0)">${t('edit')}</button> <button class="btn d s" onclick="delP('${p.id}')">${t('del')}</button></td></tr>`).join('')}</table></div>`;
  }
  if (aTab == 'usr') {
    c = `<div class="box sc"><table><tr><th>${t('nameL')}</th><th>${t('userL')}</th><th>${t('email')}</th><th>${t('ordersL')}</th><th>${t('joined')}</th></tr>${arr('users').filter(x => x.role != 'admin').map(x => `<tr><td>${E(x.name)}</td><td>${E(x.user)}</td><td>${E(x.email)}</td><td>${O.filter(o => o.uid == x.id).length}</td><td class="mut">${x.at ? dt(x.at) : '-'}</td></tr>`).join('') || `<tr><td colspan=5 class="mut">${t('noMem')}</td></tr>`}</table></div>`;
  }

}
 
const trk = async (id, k, v) => { const o = D.orders[id]; o[k] = v; await put('orders', o); toast(t('tSaved')); },
      delP = async i => {
        if (confirm(t('confDel'))) {
          if (await rm('products', i)) {
            let rv = LS('ink-rv') || []; LS('ink-rv', rv.filter(x => x !== i));
            let w = (LS('ink-wl') || []).filter(x => x !== i); LS('ink-wl', w); wl = w;

async function saveP(e) {
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
  f.cat = f.cat.trim(); f.price = +f.price; f.old = +f.old || 0; f.stock = +f.stock;
  const hs = f.sold0 !== ''; f.sold0 = hs ? +f.sold0 : null;

/* ---------- Lucky Spin Wheel Feature ---------- */
const PZ = ['INK10', 'FREESHIP', 'SAVE50', 'NONE', 'INK10', 'FREESHIP'], pzl = c => c == 'NONE' ? t('lTry') : vlab(c), today = () => new Date().toDateString();
let spun = false, rot = 0;
 
const wheel = () => {
  const R = 140, pt = (a, r = R) => [150 + r * Math.sin(a * Math.PI / 180), 150 - r * Math.cos(a * Math.PI / 180)];
  return `<svg class="w1" id="wl" viewBox="0 0 300 300" style="transform:rotate(${rot}deg)">${PZ.map((c, i) => { const [x0, y0] = pt(i * 60), [x1, y1] = pt(i * 60 + 60), f = i % 2 ? '#fff3ee' : '#ee4d2d', tc2 = i % 2 ? '#c93a1c' : '#fff'; return `<path d="M150 150 L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${f}" stroke="#fff" stroke-width="2"/><text transform="rotate(${i * 60 + 30} 150 150)" x="150" y="52" text-anchor="middle" font-family="Inter,Noto Sans Thai" font-weight="700" font-size="14" fill="${tc2}">${E(pzl(c))}</text>`; }).join('')}</svg>`;
};
function openSpin() {
  const done = LS('ink-spin') == today(); spun = false;
  $('#mb').innerHTML = `<button class="mx" onclick="closeM()" aria-label="Close">${ic('x', 16)}</button><h3>${t('spinT')}</h3><span class="mut">${done ? t('spinAgain') : t('spinS')}</span><div class="wh"><svg class="pt" width="28" height="30" viewBox="0 0 28 30"><path d="M14 30 2 8a14 14 0 1 1 24 0z" fill="#1f1f1f"/><circle cx="14" cy="12" r="4" fill="#fff"/></svg>${wheel()}<div class="hub">${ic('bolt', 20)}</div></div><div id="sr" style="min-height:44px"></div><button class="btn blk" id="sb" style="padding:12px" ${done ? 'disabled' : ''} onclick="doSpin()">${t('spinGo')}</button>`;
  $('#md').classList.add('on');
}
const closeM = () => $('#md').classList.remove('on');
function doSpin() {
  if (spun || LS('ink-spin') == today()) return; spun = true; $('#sb').disabled = true;
  const i = Math.floor(Math.random() * PZ.length), c = PZ[i];
  rot += 360 * 6 + ((360 - (i * 60 + 30)) - (rot % 360) + 360) % 360;
  const w = $('#wl'); w.style.transform = `rotate(${rot}deg)`; LS('ink-spin', today());
  setTimeout(() => {
    if (c == 'NONE') $('#sr').innerHTML = `<p style="margin:10px 0 0;font-weight:600">${t('spinLose')}</p>`;
    else {
      if (!wal.includes(c)) { wal = [...wal, c]; LS('ink-wallet', wal); }
      $('#sr').innerHTML = `<p style="margin:10px 0 2px;font:700 18px 'Inter','Noto Sans Thai';color:var(--o)">${t('spinWon', E(pzl(c)))}</p><span class="mut">${t('spinUse')}</span>`;
      $('#sb').outerHTML = `<button class="btn blk" style="padding:12px;margin-top:10px" onclick="closeM();location.hash='#/cart'">${t('spinCart')}</button>`;
    }
  }, 5200);
}
 
/* ---------- Floating Actions & Router Execution ---------- */
document.body.insertAdjacentHTML('beforeend', `<button class="fab" id="fab" onclick="openSpin()"></button>`);
const fabL = () => { $('#fab').innerHTML = ci('spin', 26) + t('pSpin'); $('#up').innerHTML = ic('up', 20); };
addEventListener('scroll', () => $('#up').classList.toggle('on', scrollY > 600), { passive: true });
 
let rpI = 0;
setInterval(() => {
  const r = location.hash.slice(2).split('/')[0]; if (!ready || ['admin', 'login', 'register', 'checkout', 'cart'].includes(r)) return;
  const o = arr('orders').filter(o => o.st != 5 && o.items && o.items[0] && o.addr).sort((a, b) => b.at - a.at).slice(0, 6);
  if (!o.length) return; const x = o[rpI++ % o.length], e = $('#rp');
  e.innerHTML = `<span class="rpi">${ic('pin', 18)}</span><div><span class="mut">${t('rpWho', E(x.addr.prov))}</span><br><b>${E(x.items[0].name)}</b></div>`;
  e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 5200);
}, 14000);
 
function go() {
  if (!ready) return;
  const [r, a] = location.hash.slice(2).split('/'); let v;
  if (r == 'admin') v = admin();
  else if (r == 'p') v = prod(a);
  else if (r == 'cart') v = cartV();
  else if (r == 'checkout') v = checkout();
  else if (r == 'orders') v = orders();
  else if (r == 'account') v = account();
  else if (r == 'login') v = authV(0);
  else if (r == 'register') v = authV(1);
  else v = home();
  if (v) { $('#app').innerHTML = v; slide = 0; document.body.classList.toggle('adm-on', r == 'admin'); fabL(); tick(); }
}
 
addEventListener('hashchange', () => { scrollTo(0, 0); go(); });
document.documentElement.lang = lang; fabL(); init();
